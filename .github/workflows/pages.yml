name: Verify Flutter scaffold and publish counter demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI: 'true'
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Acquire pinned official Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.38.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = '3b62efc2a3da49882f43c372e0bc53daef7295a6'
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      - name: Resolve locked packages, analyze and run original widget test
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build actual counter demo under repository path
        run: flutter build web --release --base-href /brainboost-flutter/ --no-web-resources-cdn
      - name: Preserve full runtime and font license notices
        run: python3 scripts/copy_web_licenses.py
      - name: Check real Chromium rendering and capture screenshots
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/verify_web.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
